<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro - Bigotes y Patitas</title>
  <!-- El registro ahora vive en login.html (pestaña "Registrarme", 4 pasos).
       Esta página se conserva para que los enlaces viejos sigan funcionando. -->
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      p.set('modo', 'registro');
      window.location.replace('login.html?' + p.toString());
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=login.html?modo=registro" /></noscript>
</head>
<body>
  <p style="font-family:sans-serif; text-align:center; margin-top:40px;">
    Abriendo el registro… <a href="login.html?modo=registro">Da clic aquí si no avanza</a>.
  </p>
</body>
</html>
