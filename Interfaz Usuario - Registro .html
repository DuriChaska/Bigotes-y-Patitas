<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="header"></div>

  <section class="client-interface registration">
    <h2>Registro Usuario</h2>
    <form class="registration-form" id="registerForm">
      <div class="input-group">
        <input type="text" id="reg-nombre" placeholder="Nombre" required />
        <input type="text" id="reg-apellidos" placeholder="Apellidos" required />
      </div>
      <input type="email" id="reg-correo" placeholder="Correo" required />
      <input type="text" id="reg-telefono" placeholder="Teléfono" required />
      <input type="text" id="reg-mascota" placeholder="Nombre y raza de tu mascota (opcional)" />
      <input type="password" id="reg-pass" placeholder="Contraseña" required minlength="6" />
      <input type="password" id="reg-pass2" placeholder="Confirmar Contraseña" required minlength="6" />
      <button type="submit">REGISTRARSE</button>
      <p id="registerError" style="display:none; color:#b8603a; margin-top:15px;"></p>
      <p id="registerMessage" style="display:none; color:#054704; margin-top:15px;">
        Registro exitoso. Redirigiendo al inicio de sesión...
      </p>
    </form>
  </section>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module" src="registro.js"></script>
</body>
</html>
