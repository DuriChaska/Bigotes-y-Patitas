<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle del Producto - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="header"></div>

  <main class="product-page">
    <div id="toast-container"></div>

    <section class="producto-detalle">
      <div class="product-image">
        <img id="imagen-producto" src="" alt="Producto" />
      </div>
      <div class="product-details">
        <h1 id="nombre-producto"></h1>
        <div class="price" id="precio-producto"></div>
        <p id="aviso-stock" style="display:none; font-weight:700; font-size:.85rem; margin-bottom:8px;"></p>
        <p id="descripcion-producto"></p>

        <div class="quantity-control">
          <label for="cantidad">Cantidad:</label>
          <button class="qty-btn" type="button" onclick="cambiarCantidad(-1)">−</button>
          <input type="number" id="cantidad" value="1" min="1" />
          <button class="qty-btn" type="button" onclick="cambiarCantidad(1)">+</button>
        </div>

        <div class="actions">
          <button class="add-to-cart" type="button" onclick="agregarAlCarrito()">AGREGAR AL CARRITO</button>
          <button class="buy-now" type="button" onclick="comprarAhora()">COMPRAR AHORA</button>
        </div>
        <div class="actions">
          <button class="regresar" type="button" onclick="window.location.href='shop.html'">← Regresar al catálogo</button>
        </div>
      </div>
    </section>

    <section class="similares">
      <h2>Artículos similares</h2>
      <div id="articulos-similares" class="grid"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module" src="producto.js"></script>
</body>
</html>
