<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="header"></div>

  <section class="client-interface login">
    <h2>Iniciar Sesión</h2>
    <form class="login-form" id="loginForm">
      <input type="email" id="login-correo" placeholder="Correo electrónico" required />
      <input type="password" id="login-pass" placeholder="Contraseña" required />
      <p id="loginError" style="color:#c0392b; font-size:.85rem; display:none; margin:.4rem 0 0;"></p>
      <button type="submit">Entrar</button>
    </form>
    <p style="margin-top:.8rem; font-size:.9rem;">
      <a href="#" id="linkOlvide" style="color:var(--pink-medio); font-weight:600;">¿Olvidaste tu contraseña?</a>
    </p>
    <form class="login-form" id="olvideForm" style="display:none; margin-top:.6rem;" novalidate>
      <p style="font-size:.85rem; margin:0 0 .4rem;">Escribe el correo de tu cuenta y te mandaremos un enlace para crear una contraseña nueva.</p>
      <input type="email" id="olvide-correo" placeholder="Correo electrónico" autocomplete="email" />
      <p id="olvideMsg" style="font-size:.85rem; display:none; margin:.4rem 0 0;"></p>
      <button type="submit">Enviar enlace</button>
    </form>
    <p style="margin-top:1rem; font-size:.9rem;">
      ¿No tienes cuenta?
      <a href="#" id="linkRegistro" style="color:var(--pink-medio); font-weight:600;">Regístrate aquí</a>
    </p>
  </section>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module">
    import { loginCliente, enviarCorreoRecuperacion } from './firebase-db.js';

    const form = document.getElementById('loginForm');
    const error = document.getElementById('loginError');
    const next = new URLSearchParams(window.location.search).get('next');

    // Avisos al llegar desde el registro o desde un enlace de correo.
    const parametros = new URLSearchParams(window.location.search);
    const AVISOS_LLEGADA = {
      registrado: '✅ ¡Tu cuenta se creó! Te enviamos un correo de bienvenida. Inicia sesión con tu correo y contraseña.',
      restablecida: '✅ Tu contraseña se cambió. Inicia sesión con la nueva.',
      verificado: '✅ Tu correo quedó confirmado. Ya puedes iniciar sesión.',
    };
    const llegada = Object.keys(AVISOS_LLEGADA).find(k => parametros.get(k) === '1');
    if (llegada) {
      const aviso = document.createElement('p');
      aviso.setAttribute('role', 'status');
      aviso.style.cssText = 'background:#e5efe4;color:#2f6b3a;border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0 0 .8rem;';
      aviso.textContent = AVISOS_LLEGADA[llegada];
      form.parentNode.insertBefore(aviso, form);
    }
    if (parametros.get('correo')) {
      document.getElementById('login-correo').value = parametros.get('correo');
      document.getElementById('login-pass').focus();
    }

    const linkRegistro = document.getElementById('linkRegistro');
    linkRegistro.href = 'Interfaz Usuario - Registro .html' + (next ? '?next=' + encodeURIComponent(next) : '');

    // Mismo mensaje si el correo no existe o la contraseña está mal: así nadie puede averiguar
    // qué correos tienen cuenta.
    const ERRORES_FIREBASE = {
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/invalid-email': 'El correo no es válido.',
      'auth/user-not-found': 'Correo o contraseña incorrectos.',
      'auth/wrong-password': 'Correo o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    };

    // ---- Bloqueo de 5 minutos tras 5 intentos fallidos (cuenta regresiva en pantalla) ----
    let relojBloqueo = null;
    function mostrarBloqueo(restanteMs) {
      const boton = form.querySelector('button[type=submit]');
      const fin = Date.now() + restanteMs;
      clearInterval(relojBloqueo);
      const pintar = () => {
        const ms = fin - Date.now();
        if (ms <= 0) {
          clearInterval(relojBloqueo);
          error.style.display = 'none';
          boton.disabled = false;
          boton.textContent = 'Entrar';
          return;
        }
        const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
        error.textContent = `🔒 Por seguridad bloqueamos el acceso a esta cuenta después de 5 intentos fallidos. Podrás intentar de nuevo en ${m}:${String(s).padStart(2, '0')}.`;
        error.style.display = 'block';
        boton.disabled = true;
        boton.textContent = 'Bloqueado';
      };
      pintar();
      relojBloqueo = setInterval(pintar, 1000);
    }

    // ---- ¿Olvidaste tu contraseña? (Firebase manda el enlace para crear una nueva) ----
    const olvideForm = document.getElementById('olvideForm');
    const olvideMsg = document.getElementById('olvideMsg');
    document.getElementById('linkOlvide').addEventListener('click', (e) => {
      e.preventDefault();
      const visible = olvideForm.style.display !== 'none';
      olvideForm.style.display = visible ? 'none' : 'flex';
      if (!visible) {
        document.getElementById('olvide-correo').value = document.getElementById('login-correo').value.trim();
        document.getElementById('olvide-correo').focus();
      }
    });
    olvideForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const correo = document.getElementById('olvide-correo').value.trim();
      const boton = olvideForm.querySelector('button[type=submit]');
      olvideMsg.style.display = 'block';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) {
        olvideMsg.style.color = '#c0392b';
        olvideMsg.textContent = 'Escribe un correo válido.';
        return;
      }
      boton.disabled = true;
      try {
        await enviarCorreoRecuperacion(correo);
        olvideMsg.style.color = '#2f6b3a';
        // Por seguridad no se dice si el correo existe o no.
        olvideMsg.textContent = `Si ${correo} tiene una cuenta, te llegará un enlace en unos minutos (revisa también spam). Abre el correo MÁS RECIENTE: el enlace sirve una sola vez y por 1 hora.`;
      } catch (err) {
        olvideMsg.style.color = '#c0392b';
        olvideMsg.textContent = err.code === 'bp/espera-reenvio' ? err.message
          : err.code === 'auth/too-many-requests'
          ? 'Demasiados intentos. Espera un momento.'
          : err.code === 'auth/invalid-email' ? 'El correo no es válido.' : 'No se pudo enviar el enlace. Revisa tu conexión.';
      }
      boton.disabled = false;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.style.display = 'none';

      const correo = document.getElementById('login-correo').value.trim();
      const pass = document.getElementById('login-pass').value;
      const boton = form.querySelector('button[type=submit]');
      boton.disabled = true;
      boton.textContent = 'Entrando...';

      try {
        await loginCliente(correo, pass);
        window.location.href = next || 'Interfaz Cliente - Perfil.html';
      } catch (err) {
        if (err.code === 'bp/cuenta-bloqueada') { mostrarBloqueo(err.restanteMs); return; }
        let texto = ERRORES_FIREBASE[err.code] || 'No se pudo iniciar sesión. Revisa tu conexión.';
        if (typeof err.intentosRestantes === 'number') {
          texto += err.intentosRestantes === 1
            ? ' Te queda 1 intento antes de que la cuenta se bloquee 5 minutos.'
            : ` Te quedan ${err.intentosRestantes} intentos.`;
        }
        error.textContent = texto;
        error.style.display = 'block';
        boton.disabled = false;
        boton.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
