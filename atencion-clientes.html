<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atención a clientes - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="header"></div>

  <section class="cta-wrap">
    <aside class="cta-menu" id="cuenta-menu"></aside>

    <div>
      <div class="cta-head">
        <h2>Atención a clientes (Tickets)</h2>
        <p>Cuéntanos tu duda o problema y nuestro equipo de soporte te responderá aquí mismo.
           Sesión: <strong id="sesion-nombre">…</strong></p>
      </div>

      <div class="cta-main">
        <!-- Izquierda: nuevo ticket -->
        <div class="cta-card">
          <h3>Nuevo ticket</h3>
          <form id="form-ticket" novalidate>
            <label for="ticket-asunto">Asunto</label>
            <select id="ticket-asunto">
              <option>Duda sobre mi pedido</option>
              <option>Cambio de producto</option>
              <option>Facturación</option>
              <option>Problema con monedero</option>
            </select>

            <label for="ticket-mensaje">Mensaje</label>
            <textarea id="ticket-mensaje" maxlength="2000"
              placeholder="Describe tu problema con el mayor detalle posible (por ejemplo, el folio de tu pedido)…"></textarea>

            <p class="cta-aviso" id="ticket-error"></p>
            <button type="submit" class="cta-btn" id="btn-enviar">Enviar ticket</button>
          </form>
        </div>

        <!-- Derecha: mis tickets + hilo -->
        <div>
          <div class="cta-card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;">
              <h3 style="margin:0;">Mis tickets</h3>
              <span class="cta-banner" id="banner-sin-leer" style="display:none;"></span>
            </div>
            <div id="lista-tickets"><p style="color:var(--gray); font-size:.88rem;">Cargando…</p></div>
          </div>

          <div class="cta-card" id="detalle-ticket" style="display:none;"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer"></div>
  <div class="cta-toast" id="toast"></div>

  <script src="components.js"></script>
  <script src="cuenta-menu.js"></script>
  <script type="module">
    import {
      obtenerUsuarioActual, obtenerPerfilCliente,
      crearTicket, escucharTicketsDeCliente, marcarTicketLeido,
    } from './firebase-db.js';

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let usuario = null;
    let perfil = null;
    let tickets = [];
    let seleccionado = new URLSearchParams(window.location.search).get('ticket');

    // Colores: En proceso = amarillo, Solucionado (se muestra "Respondido") = verde, Cerrado = gris.
    const claseEstado = (e) => e === 'Cerrado' ? 'cerrado' : (e === 'Solucionado' ? 'respondido' : 'proceso');
    const etiquetaEstado = (e) => e === 'Solucionado' ? 'Respondido' : (e || 'En proceso');

    function fechaTicket(valor) {
      if (!valor) return '';
      const f = typeof valor.toDate === 'function' ? valor.toDate() : new Date(valor);
      return isNaN(f.getTime()) ? '' : f.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function sinLeer() { return tickets.filter(t => t.leidoCliente === false).length; }

    function pintarLista() {
      const cont = document.getElementById('lista-tickets');
      const n = sinLeer();

      const banner = document.getElementById('banner-sin-leer');
      banner.style.display = n > 0 ? '' : 'none';
      banner.innerHTML = `<span class="tk-dot"></span> ${n} respuesta${n === 1 ? '' : 's'} sin leer`;
      pintarMenuCuenta('atencion', n);

      if (tickets.length === 0) {
        cont.innerHTML = '<p style="color:var(--gray); font-size:.88rem;">Aún no tienes tickets. Escribe el primero en el formulario de la izquierda.</p>';
        return;
      }
      cont.innerHTML = tickets.map(t => `
        <div class="tk-item ${t.id === seleccionado ? 'sel' : ''}" data-id="${esc(t.id)}">
          <div class="tk-item-main">
            <span class="tk-folio">${esc(t.folio || t.id)}</span>
            <span class="tk-asunto">${esc(t.asunto)}</span>
            ${t.leidoCliente === false ? '<span class="tk-dot" title="Respuesta nueva"></span>' : ''}
          </div>
          <span class="tk-badge ${claseEstado(t.estado)}">${esc(etiquetaEstado(t.estado))}</span>
        </div>`).join('');
      cont.querySelectorAll('.tk-item').forEach(el => el.addEventListener('click', () => abrirTicket(el.dataset.id)));
    }

    // Hilo de la conversación: mensaje del cliente + respuestas del agente.
    function hiloDe(t) {
      if (Array.isArray(t.hilo) && t.hilo.length) return t.hilo;
      const h = [{ de: 'cliente', nombre: t.clienteNombre, texto: t.mensaje, fecha: '' }];
      if (t.respuesta) h.push({ de: 'soporte', nombre: t.agente || 'Soporte', texto: t.respuesta, fecha: '' });
      return h;
    }

    function pintarDetalle() {
      const caja = document.getElementById('detalle-ticket');
      const t = tickets.find(x => x.id === seleccionado);
      if (!t) { caja.style.display = 'none'; return; }
      caja.style.display = '';
      caja.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-bottom:1px solid #f1ece1; padding-bottom:10px;">
          <div>
            <small style="font-weight:700; color:var(--pink-fuerte);">${esc(t.folio || t.id)} · ${esc(fechaTicket(t.creadoEn))}</small>
            <h3 style="margin:2px 0 0;">${esc(t.asunto)}</h3>
          </div>
          <span class="tk-badge ${claseEstado(t.estado)}">${esc(etiquetaEstado(t.estado))}</span>
        </div>
        <div class="tk-hilo">
          ${hiloDe(t).map(m => `
            <div class="tk-msg ${m.de === 'soporte' ? 'soporte' : ''}">
              <div class="tk-msg-top">
                <strong>${m.de === 'soporte' ? '🎧 Soporte · ' + esc(m.nombre || 'Agente') : 'Tú'}</strong>
                <span>${esc(m.fecha ? fechaTicket(m.fecha) : '')}</span>
              </div>
              <p>${esc(m.texto)}</p>
            </div>`).join('')}
          ${t.esperaSoporte ? `<div class="tk-msg" style="text-align:center; background:#fcefd0; border-color:#f0d68a; color:#7a5a10;">
             ⏳ Tu solicitud está en espera de atención de nuestro equipo.</div>` : ''}
          ${t.estado === 'Cerrado' ? `<div class="tk-msg" style="text-align:center; color:var(--gray);">
             Este ticket está cerrado. Si necesitas algo más, crea uno nuevo.</div>` : ''}
        </div>`;
    }

    function abrirTicket(id) {
      seleccionado = id;
      const t = tickets.find(x => x.id === id);
      // Al abrirlo se apaga la alerta de "respuesta sin leer".
      if (t && t.leidoCliente === false) {
        marcarTicketLeido(id).catch(err => console.error('No se pudo marcar como leído:', err));
      }
      pintarLista();
      pintarDetalle();
      document.getElementById('detalle-ticket').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('form-ticket').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('ticket-error');
      const boton = document.getElementById('btn-enviar');
      error.style.display = 'none';

      const asunto = document.getElementById('ticket-asunto').value;
      const mensaje = document.getElementById('ticket-mensaje').value;
      if (!mensaje.trim()) {
        error.textContent = 'Escribe el mensaje para que podamos ayudarte.';
        error.style.display = 'block';
        return;
      }

      boton.disabled = true;
      boton.textContent = 'Enviando…';
      try {
        const folio = await crearTicket({
          asunto, mensaje,
          cliente: { uid: usuario.uid, nombre: perfil?.nombre || usuario.displayName || usuario.email, correo: usuario.email },
        });
        document.getElementById('ticket-mensaje').value = '';
        seleccionado = folio;
        toast(`Ticket ${folio} enviado. Te avisaremos aquí cuando respondamos.`);
      } catch (err) {
        console.error(err);
        error.textContent = err && err.code === 'permission-denied'
          ? 'No tienes permiso para enviar tickets. Avisa a la tienda para que revise la configuración.'
          : (err.message || 'No se pudo enviar el ticket. Revisa tu conexión.');
        error.style.display = 'block';
      }
      boton.disabled = false;
      boton.textContent = 'Enviar ticket';
    });

    (async function iniciar() {
      pintarMenuCuenta('atencion', 0);
      usuario = await obtenerUsuarioActual();
      if (!usuario) {
        window.location.href = 'login.html?next=' + encodeURIComponent('atencion-clientes.html');
        return;
      }
      try { perfil = await obtenerPerfilCliente(usuario.uid); } catch (err) { console.error(err); }
      document.getElementById('sesion-nombre').textContent = (perfil?.nombre || usuario.displayName || usuario.email);

      escucharTicketsDeCliente(usuario.uid, (lista) => {
        tickets = lista;
        // Si el ticket abierto recibe respuesta mientras se mira, se marca como leído de inmediato.
        const abierto = tickets.find(t => t.id === seleccionado);
        if (abierto && abierto.leidoCliente === false) {
          marcarTicketLeido(abierto.id).catch(() => {});
        }
        pintarLista();
        pintarDetalle();
      }, (err) => {
        console.error(err);
        document.getElementById('lista-tickets').innerHTML =
          '<p style="color:#b3261e; font-size:.88rem;">No se pudieron cargar tus tickets. Revisa tu conexión.</p>';
      });
    })();
  </script>
</body>
</html>
