mutation InsertCustomer($data: Customer_Data!) @auth(level: USER) {
  customer_insert(data: $data)
}

mutation UpsertCustomer($data: Customer_Data!) @auth(level: USER) {
  customer_upsert(data: $data)
}

mutation UpdateCustomer($id: UUID!, $data: Customer_Data!) @auth(level: USER) {
  customer_update(id: $id, data: $data)
}

mutation DeleteCustomer($id: UUID!) @auth(level: USER) {
  customer_delete(id: $id)
}

query GetCustomer($id: UUID!) @auth(level: USER) {
  customer(id: $id) {
    id name email status
  }
}

query ListCustomers @auth(level: USER) {
  customers {
    id name email status
  }
}

