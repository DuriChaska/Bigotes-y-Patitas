<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="dialogos.js"></script>
</head>
<body class="cat-body">

  <div id="header"></div>
  <div id="toast-container"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cat-huella" viewBox="0 0 64 64">
      <ellipse cx="32" cy="44" rx="15" ry="13"/>
      <ellipse cx="13" cy="27" rx="7" ry="9" transform="rotate(-20 13 27)"/>
      <ellipse cx="25" cy="15" rx="7" ry="9" transform="rotate(-6 25 15)"/>
      <ellipse cx="40" cy="15" rx="7" ry="9" transform="rotate(6 40 15)"/>
      <ellipse cx="52" cy="27" rx="7" ry="9" transform="rotate(20 52 27)"/>
    </symbol>
    <symbol id="cat-corazon" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.6 4.5 7.1 4.5c2 0 3.4 1.1 4.9 3 1.5-1.9 2.9-3 4.9-3 3.5 0 5.6 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="cat-flecha" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="cat-filtro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2.2" fill="#fff"/><circle cx="16" cy="12" r="2.2" fill="#fff"/><circle cx="10" cy="18" r="2.2" fill="#fff"/></g></symbol>
    <symbol id="cat-lupa" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></g></symbol>
    <symbol id="cat-camion" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4.5l3.5 3.5V16h-8z"/><circle cx="6" cy="17.5" r="1.8" fill="#fff"/><circle cx="17" cy="17.5" r="1.8" fill="#fff"/></g></symbol>
    <symbol id="cat-cuadros" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></g></symbol>
    <symbol id="cat-lista" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></g></symbol>
    <symbol id="cat-cinta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></g></symbol>
  </svg>

  <main class="cat-pagina">
    <!-- ===== Filtros ===== -->
    <aside class="cat-filtros" id="cat-filtros" aria-label="Filtros">
      <div class="cat-filtros-cab">
        <h2><svg><use href="#cat-filtro"/></svg> Filtra tu búsqueda</h2>
        <button type="button" class="cat-cerrar-filtros" id="cerrar-filtros" aria-label="Cerrar filtros">×</button>
      </div>

      <div class="cat-buscar">
        <label class="sr-solo" for="buscar">Buscar productos</label>
        <input type="search" id="buscar" placeholder="Busca: suéter, rojo, collar…" autocomplete="off" />
        <svg><use href="#cat-lupa"/></svg>
      </div>

      <div class="cat-grupo" data-grupo="novedades">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Novedades <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo" id="f-novedades"></div>
      </div>
      <div class="cat-grupo" data-grupo="categoria">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Mascotas y categorías <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo" id="f-categoria"></div>
      </div>
      <div class="cat-grupo" data-grupo="para">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Para quién <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo" id="f-para"></div>
      </div>
      <div class="cat-grupo" data-grupo="talla">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Talla <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo" id="f-talla"></div>
      </div>
      <div class="cat-grupo" data-grupo="marca">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Marca <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo" id="f-marca"></div>
      </div>
      <div class="cat-grupo" data-grupo="precio">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Precio <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo">
          <label class="sr-solo" for="precio">Precio o rango</label>
          <input type="text" id="precio" class="cat-input" placeholder="Escribe: 299 ó 250-400" inputmode="numeric" />
          <p class="cat-ayuda">Un número = hasta ese precio. También puedes usar &lt;300 o &gt;500.</p>
          <div class="cat-chips" id="f-precio-rapido">
            <button type="button" data-precio="-300">Hasta $300</button>
            <button type="button" data-precio="300-500">$300 a $500</button>
            <button type="button" data-precio=">500">Más de $500</button>
          </div>
        </div>
      </div>
      <div class="cat-grupo" data-grupo="disponible">
        <button type="button" class="cat-grupo-cab" aria-expanded="true">Disponibilidad <svg><use href="#cat-flecha"/></svg></button>
        <div class="cat-grupo-cuerpo" id="f-disponible"></div>
      </div>

      <button type="button" class="cat-limpiar" id="limpiar">Limpiar filtros</button>
      <button type="button" class="cat-ver-resultados" id="ver-resultados">Ver resultados</button>
    </aside>
    <div class="cat-velo" id="cat-velo" hidden></div>

    <!-- ===== Resultados ===== -->
    <section class="cat-contenido">
      <nav class="pd-ruta" aria-label="Ruta de navegación">
        <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>Inicio</a>
        <span>/</span><strong id="ruta-cat">Catálogo</strong>
      </nav>
      <h1 class="cat-titulo" id="cat-titulo">Ropa y accesorios</h1>

      <div class="cat-banner" aria-hidden="true">
        <div class="cat-banner-foto f1"><img src="Imagenes/Productos/sueter-rojo-monos-1.jpg" alt="" /></div>
        <div class="cat-banner-foto f2"><img src="Imagenes/Productos/chaleco-polar-beige-3.jpg" alt="" /></div>
        <div class="cat-banner-centro">
          <svg class="cat-banner-logo"><use href="#cat-huella"/></svg>
          <p class="cat-banner-1">Moda que</p>
          <p class="cat-banner-2">mueve colitas</p>
          <span class="cat-banner-sello"><svg><use href="#cat-camion"/></svg>Envíos a todo México</span>
        </div>
        <div class="cat-banner-foto f3"><img src="Imagenes/Productos/sueter-blanco-lentejuela-2.jpg" alt="" /></div>
        <div class="cat-banner-foto f4"><img src="Imagenes/Productos/chamarra-borrego-rosa-1.jpg" alt="" /></div>
      </div>

      <div class="cat-barra">
        <button type="button" class="cat-btn-filtros" id="abrir-filtros"><svg><use href="#cat-filtro"/></svg> Filtrar <span id="num-filtros"></span></button>
        <p class="cat-resultados" id="resultados" aria-live="polite">Cargando…</p>
        <div class="cat-vistas" role="group" aria-label="Vista">
          <button type="button" data-vista="cuadros" class="activa" aria-pressed="true" title="Cuadrícula"><svg><use href="#cat-cuadros"/></svg></button>
          <button type="button" data-vista="lista" aria-pressed="false" title="Lista"><svg><use href="#cat-lista"/></svg></button>
        </div>
        <div class="cat-orden">
          <label class="sr-solo" for="orden">Ordenar por</label>
          <select id="orden">
            <option value="destacados">Destacados</option>
            <option value="nuevos">Lo más nuevo</option>
            <option value="calificados">Mejor calificados</option>
            <option value="nombre-asc">Nombre (A a la Z)</option>
            <option value="nombre-desc">Nombre (Z a la A)</option>
            <option value="precio-asc">Precio (más económico primero)</option>
            <option value="precio-desc">Precio (mayor precio primero)</option>
          </select>
          <svg><use href="#cat-flecha"/></svg>
        </div>
      </div>

      <div class="cat-activos" id="filtros-activos"></div>
      <p class="cat-estado" id="productsState">Cargando catálogo…</p>
      <div class="cat-grid" id="productsGrid"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module" src="catalogo.js"></script>
</body>
</html>
