<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="header"></div>

  <main>
    <div id="toast-container"></div>

    <div class="shop-search-row">
      <input id="priceSearch" type="text" placeholder="Buscar por precio: 299 | 250-400" aria-label="Buscar por precio" />
      <select id="categoryFilter" aria-label="Filtrar por categoría">
        <option value="all">Todas</option>
      </select>
    </div>

    <div id="productsState" style="text-align:center; padding:40px 0; color:var(--gray);">Cargando catálogo…</div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module">
    import { escucharProductosScm } from './firebase-db.js';
    import { CATEGORIAS } from './scm-config.js';

    const grid = document.getElementById('productsGrid');
    const estado = document.getElementById('productsState');
    const priceInput = document.getElementById('priceSearch');
    const categorySelect = document.getElementById('categoryFilter');

    CATEGORIAS.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      categorySelect.appendChild(o);
    });

    // Si venimos de un enlace "PERROS / GATOS / ..." en el inicio, se preselecciona la categoría.
    const categoriaInicial = new URLSearchParams(window.location.search).get('categoria');
    if (categoriaInicial && CATEGORIAS.includes(categoriaInicial)) categorySelect.value = categoriaInicial;

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const IMG_VACIA = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#f1ece1"/>' +
      '<text x="150" y="155" font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#8a7d6b">Bigotes y Patitas</text></svg>');

    function urlImagen(u) {
      if (typeof u !== 'string' || !u.trim()) return IMG_VACIA;
      const val = u.trim();
      if (/^https?:\/\//i.test(val)) return val;
      if (!/^[a-z][a-z0-9+.-]*:/i.test(val)) return val;
      return IMG_VACIA;
    }

    function obtenerCarrito() { return JSON.parse(localStorage.getItem("carrito") || "[]"); }
    function guardarCarrito(c) {
      localStorage.setItem("carrito", JSON.stringify(c));
      window.dispatchEvent(new Event('actualizarCarrito'));
    }

    function mostrarToast(mensaje, tipo = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.textContent = mensaje;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 2800);
    }

    let productos = [];

    function agregarAlCarrito(id) {
      const producto = productos.find(p => p.id === id);
      if (!producto) { mostrarToast("Producto no encontrado", "error"); return; }
      if (Number(producto.stock) <= 0) { mostrarToast("Ese producto está agotado", "error"); return; }
      let carrito = obtenerCarrito();
      const existe = carrito.find(i => i.id === id);
      const enCarrito = existe ? existe.cantidad : 0;
      if (enCarrito + 1 > Number(producto.stock)) {
        mostrarToast(`Solo quedan ${producto.stock} de "${producto.nombre}"`, "error");
        return;
      }
      if (existe) { existe.cantidad += 1; }
      else {
        carrito.push({
          id: producto.id, nombre: producto.nombre, precio: Number(producto.precio) || 0,
          imagen: producto.img || '', cantidad: 1,
        });
      }
      guardarCarrito(carrito);
      mostrarToast(`¡Agregado! 1 × ${producto.nombre}`, "success");
    }
    window.agregarAlCarrito = agregarAlCarrito;

    function parseQuery(raw) {
      const q = (raw || "").trim().replace(/\s+/g, "");
      if (!q) return null;
      let m = q.match(/^(\d+\.?\d*)-(\d+\.?\d*)$/);
      if (m) { const [a, b] = [parseFloat(m[1]), parseFloat(m[2])]; return p => p >= Math.min(a, b) && p <= Math.max(a, b); }
      m = q.match(/^(<=|>=|<|>)(\d+\.?\d*)$/);
      if (m) { const v = parseFloat(m[2]); return { "<=": p => p <= v, ">=": p => p >= v, "<": p => p < v, ">": p => p > v }[m[1]]; }
      m = q.match(/^(\d+\.?\d*)$/);
      if (m) { const v = parseFloat(m[1]); return p => p <= v; }
      return null;
    }

    function productosFiltrados() {
      const fn = parseQuery(priceInput.value);
      const cat = categorySelect.value;
      return productos.filter(p => {
        const coincideCat = cat === 'all' || p.categoria === cat;
        const precio = Number(p.precio) || 0;
        const coincidePrecio = !fn || fn(precio);
        return coincideCat && coincidePrecio;
      });
    }

    function pintarGrid() {
      const lista = productosFiltrados();

      if (productos.length === 0) {
        grid.innerHTML = '';
        estado.style.display = '';
        estado.textContent = 'Todavía no hay productos publicados. ¡Vuelve pronto!';
        return;
      }
      if (lista.length === 0) {
        grid.innerHTML = '';
        estado.style.display = '';
        estado.textContent = 'No encontramos productos con esos filtros.';
        return;
      }
      estado.style.display = 'none';

      grid.innerHTML = lista.map(p => {
        const stock = Number(p.stock) || 0;
        const stockMin = Number(p.stockMin) || 0;
        const agotado = stock <= 0;
        const bajo = !agotado && stock <= stockMin;
        return `
        <article class="product-card${agotado ? ' agotado' : ''}" data-id="${esc(p.id)}">
          ${agotado ? '<span class="badge-stock agotado">Agotado</span>' : (bajo ? '<span class="badge-stock bajo">¡Últimas piezas!</span>' : '')}
          <img src="${esc(urlImagen(p.img))}" alt="${esc(p.nombre)}" loading="lazy" />
          <div class="product-info">
            <h3>${esc(p.nombre)}</h3>
            <p>${esc(p.descripcion || '')}</p>
          </div>
          <div class="product-price">$${(Number(p.precio) || 0).toFixed(2)} MXN</div>
          <button class="ver-detalles" type="button" onclick="window.location.href='Producto.html?id=${encodeURIComponent(p.id)}'">Ver Detalles</button>
          <button class="add-to-cart" type="button" ${agotado ? 'disabled' : ''} onclick="agregarAlCarrito('${esc(p.id)}')">AGREGAR AL CARRITO</button>
        </article>`;
      }).join('');

      grid.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => { img.src = IMG_VACIA; }, { once: true });
      });
    }

    priceInput.addEventListener('input', pintarGrid);
    categorySelect.addEventListener('change', pintarGrid);

    escucharProductosScm(
      (lista) => { productos = lista; pintarGrid(); },
      (err) => {
        console.error(err);
        estado.style.display = '';
        estado.textContent = 'No se pudo cargar el catálogo. Revisa tu conexión.';
        grid.innerHTML = '';
      }
    );
  </script>
</body>
</html>
