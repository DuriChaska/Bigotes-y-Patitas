<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promociones - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="admin-shell">
    <div id="admin-sidebar"></div>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Promociones</h1>
          <p class="admin-breadcrumb">Panel de administración · Promociones y descuentos</p>
        </div>
      </div>

      <div class="admin-panel">
        <h2>Detalles de las promociones</h2>
        <p class="panel-sub">Información que debe tener cada promoción</p>
        <ul class="admin-legend" style="gap:14px;">
          <li><span class="dot green"></span> Fecha de inicio</li>
          <li><span class="dot orange"></span> Fecha de finalización</li>
          <li><span class="dot green"></span> Estado (Activa / Inactiva / Programada)</li>
        </ul>
      </div>
    </main>
  </div>

  <script src="admin-components.js"></script>
</body>
</html>
