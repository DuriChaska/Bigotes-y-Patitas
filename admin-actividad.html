<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi actividad - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="admin-shell">
    <div id="admin-sidebar"></div>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Mi actividad</h1>
          <p class="admin-breadcrumb">Panel de administración · Actividades realizadas por el usuario</p>
        </div>
        <div class="admin-topbar-right">
          <div class="admin-search" style="gap:8px;">
            <span data-bp-icon="calendar"></span>
            <input type="date" id="fecha-desde" class="admin-date-input" onchange="filtrarPorFecha()">
            <span style="color:var(--gray);">-</span>
            <input type="date" id="fecha-hasta" class="admin-date-input" onchange="filtrarPorFecha()">
          </div>
        </div>
      </div>

      <div class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Tipo</th>
                <th>Descripción</th>
              </tr>
            </thead>
            <tbody id="actividad-lista"></tbody>
          </table>
        </div>
        <p id="actividad-conteo" style="margin-top:14px; font-size:.82rem; color:var(--gray);"></p>
      </div>
    </main>
  </div>

  <script src="admin-icons.js"></script>
  <script src="admin-components.js"></script>
  <script>
    // fechaISO se usa para filtrar; fecha es la que se muestra en la tabla
    const actividades = [
      { fechaISO: "2025-07-25", fecha: "25/07/2025", cliente: "María López",      tipo: "Llamada", descripcion: "Se discutieron nuevos diseños para la próxima temporada." },
      { fechaISO: "2025-07-24", fecha: "24/07/2025", cliente: "Luis Hernández",   tipo: "Correo",  descripcion: "Envío de información de promociones." },
      { fechaISO: "2025-07-20", fecha: "20/07/2025", cliente: "Ana García",       tipo: "Reunión", descripcion: "Reunión en tienda para muestras de productos." },
      { fechaISO: "2025-07-18", fecha: "18/07/2025", cliente: "Carlos Ruiz",      tipo: "Llamada", descripcion: "Seguimiento a pedido anterior." },
    ];

    function pintarActividad(lista) {
      const cuerpo = document.getElementById('actividad-lista');
      cuerpo.innerHTML = lista.map(a => `
        <tr>
          <td>${a.fecha}</td>
          <td>${a.cliente}</td>
          <td>${a.tipo}</td>
          <td>${a.descripcion}</td>
        </tr>
      `).join('');

      document.getElementById('actividad-conteo').textContent =
        `Mostrando 1 a ${lista.length} de ${actividades.length} actividades`;
    }

    function filtrarPorFecha() {
      const desde = document.getElementById('fecha-desde').value;
      const hasta = document.getElementById('fecha-hasta').value;
      const filtradas = actividades.filter(a => {
        const cumpleDesde = !desde || a.fechaISO >= desde;
        const cumpleHasta = !hasta || a.fechaISO <= hasta;
        return cumpleDesde && cumpleHasta;
      });
      pintarActividad(filtradas);
    }

    // Rango inicial: del primer al último registro de ejemplo
    document.getElementById('fecha-desde').value = "2025-07-01";
    document.getElementById('fecha-hasta').value = "2025-07-31";
    pintarActividad(actividades);
  </script>
</body>
</html>
