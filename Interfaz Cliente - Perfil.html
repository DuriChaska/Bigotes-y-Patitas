<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil Cliente</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── MODAL COMPRAS ──────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(58, 37, 53, .45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(58, 37, 53, .25);
      animation: slideUp .3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 {
      font-size: 1.2rem;
      color: #e07fa0;
    }
    .modal-close {
      background: #fce8f0;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      color: #9a7d8a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    .modal-close:hover { background: #f7a8c4; color: #fff; }

    /* ── COMPRA ITEM ────────────────────── */
    .compra-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid #f0e0e8;
    }
    .compra-item:last-child { border-bottom: none; }

    .compra-img {
      width: 52px; height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f7a8c4, #e07fa0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .compra-info { flex: 1; }
    .compra-nombre { font-weight: 500; font-size: .92rem; margin-bottom: 3px; }
    .compra-meta   { font-size: .78rem; color: #9a7d8a; }
    .compra-precio { font-weight: 600; color: #e07fa0; font-size: .95rem; white-space: nowrap; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 500;
      margin-top: 4px;
    }
    .badge-entregado { background: #d4f4e2; color: #1a7a45; }
    .badge-enviado   { background: #fff0d4; color: #9a6400; }
    .badge-proceso   { background: #ddeeff; color: #1a4f8a; }
  </style>
</head>

<body>

  <div id="header"></div>

  <section class="client-interface profile">

    <!-- HEADER PERFIL -->
    <div class="profile-header">
      <img src="Imagenes/Kim.jpg" alt="Foto de perfil" class="profile-pic" />
      <div class="profile-info">
        <h2 id="nombreCliente">Cargando…</h2>
        <p id="arrobaCliente"></p>
      </div>
    </div>

    <!-- INFO -->
    <div class="profile-sections">

      <div class="profile-item">
        <h3>Mis datos</h3>
        <p>
          Correo: <span id="correoCliente">—</span><br />
          Teléfono: <span id="telefonoCliente">—</span><br />
          Mascota: <span id="mascotaCliente">—</span>
        </p>
      </div>

      <div class="profile-item">
        <h3>Mis compras</h3>
        <p>Tienes <strong id="numCompras">0</strong> compras registradas.</p>
      </div>

      <!-- ACCIONES -->
      <div class="profile-actions">

        <button class="btn-pro"
          onclick="window.location.href='publicar.html'">
          ➕ Publicar producto
        </button>

        <button class="btn-outline"
          onclick="window.location.href='mis-publicaciones.html'">
          📦 Ver mis publicaciones
        </button>

        <button class="btn-outline"
          onclick="abrirCompras()">
          🛍️ Ver mis compras
        </button>

      </div>

      <!-- RESUMEN C2C -->
      <div class="profile-item">
        <h3>Resumen de ventas</h3>
        <p id="totalProductos">Productos publicados: 0</p>
      </div>

      <button class="logout-btn" onclick="cerrarSesion()">
        Cerrar sesión
      </button>

    </div>
  </section>

  <!-- MODAL COMPRAS -->
  <div class="modal-overlay" id="modalCompras">
    <div class="modal">
      <div class="modal-header">
        <h2>🛍️ Mis compras</h2>
        <button class="modal-close" onclick="cerrarCompras()">✕</button>
      </div>
      <div id="listaCompras"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="components.js"></script>

  <script type="module">
    import { obtenerUsuarioActual, obtenerPerfilCliente, escucharVentasDeCliente, logoutCliente } from './firebase-db.js';

    /* ── Historial de compras REAL (Firestore: colección "ventas") ── */
    let ventasCliente = [];

    const badgeMap = {
      Confirmada: ["badge-proceso",   "Confirmada ✓"],
      Enviada:    ["badge-enviado",   "Enviada 🚚"],
      Entregada:  ["badge-entregado", "Entregada ✓"],
      Cancelada:  ["badge-proceso",   "Cancelada"]
    };

    function formatearMoneda(valor) {
      return `$${Number(valor || 0).toFixed(2)}`;
    }

    // "creadoEn" llega como Timestamp de Firestore (tiene .toDate()); por si
    // el snapshot todavía no lo resolvió, se cubre también el caso null.
    function formatFecha(valor) {
      if (!valor) return "";
      const fecha = typeof valor.toDate === "function" ? valor.toDate() : new Date(valor);
      if (isNaN(fecha.getTime())) return "";
      const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
      return `${fecha.getDate()} ${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
    }

    function formatFechaISO(valor) {
      if (!valor) return "";
      const fecha = typeof valor.toDate === "function" ? valor.toDate() : new Date(valor);
      return isNaN(fecha.getTime()) ? "" : fecha.toISOString().split("T")[0];
    }

    function pintarPerfil(perfil, usuario) {
      document.getElementById("nombreCliente").textContent = perfil?.nombre || usuario.email;
      document.getElementById("arrobaCliente").textContent = "@" + (usuario.email || "").split("@")[0];
      document.getElementById("correoCliente").textContent = usuario.email || perfil?.correo || "—";
      document.getElementById("telefonoCliente").textContent = perfil?.telefono || "Sin registrar";
      document.getElementById("mascotaCliente").textContent = perfil?.mascota || "Sin especificar";
    }

    function pintarNumCompras() {
      document.getElementById("numCompras").textContent = ventasCliente.length;
    }

    function abrirCompras() {
      const lista = document.getElementById("listaCompras");

      if (ventasCliente.length === 0) {
        lista.innerHTML = `<p style="text-align:center;color:#9a7d8a;padding:20px 0">Aún no tienes compras 🛒</p>`;
      } else {
        lista.innerHTML = ventasCliente.map((v, index) => {
          const [cls, label] = badgeMap[v.estado] || ["badge-proceso", v.estado || "Confirmada"];
          const items = v.items || [];
          const nombreResumen = items.length > 1
            ? `${items[0]?.nombre || "Producto"} y ${items.length - 1} más`
            : (items[0]?.nombre || "Pedido");
          return `
            <div class="compra-item" style="cursor:pointer;" onclick="verTicketDetalle(${index})">
              <div class="compra-img">🛍️</div>
              <div class="compra-info">
                <div class="compra-nombre">${nombreResumen}</div>
                <div class="compra-meta">Pedido: ${v.folio || v.id} · ${formatFecha(v.creadoEn)}</div>
                <span class="badge ${cls}">${label}</span>
              </div>
              <div style="text-align:right">
                <div class="compra-precio">${formatearMoneda(v.total)}</div>
                <small style="color:#b34a8e; font-size:10px;">Ver ticket</small>
              </div>
            </div>
          `;
        }).join("");
      }

      document.getElementById("modalCompras").classList.add("open");
    }

    // Reconstruye el mismo objeto que factura.html espera en "ultimaCompra",
    // pero a partir de la venta real guardada en Firestore.
    function verTicketDetalle(index) {
      const venta = ventasCliente[index];
      if (!venta) return;
      localStorage.setItem("ultimaCompra", JSON.stringify({
        factura: venta.folio,
        pedido: venta.folio,
        fecha: formatFechaISO(venta.creadoEn),
        cliente: venta.clienteNombre,
        subtotal: venta.subtotal,
        envio: venta.envio,
        total: venta.total,
        cupon: venta.cupon,
        descripcionCupon: venta.descripcionCupon,
        descuento: venta.descuento,
        productos: venta.items,
      }));
      window.location.href = "factura.html";
    }

    function cerrarCompras() {
      document.getElementById("modalCompras").classList.remove("open");
    }

    document.getElementById("modalCompras").addEventListener("click", function (e) {
      if (e.target === this) cerrarCompras();
    });

    async function cerrarSesion() {
      try { await logoutCliente(); } catch (err) { console.error(err); }
      window.location.href = "login.html";
    }

    window.abrirCompras = abrirCompras;
    window.cerrarCompras = cerrarCompras;
    window.verTicketDetalle = verTicketDetalle;
    window.cerrarSesion = cerrarSesion;

    /* ── Publicaciones C2C (sección aparte, no forma parte del historial de compras) ── */
    const publicacionesBase = [
      {
        id: "P001",
        nombre: "Crop Top Encaje",
        precio: 210,
        talla: "S",
        categoria: "Tops",
        estado: "disponible",
        fecha: "2025-03-20"
      },
      {
        id: "P002",
        nombre: "Falda Plisada Rosa",
        precio: 390,
        talla: "M",
        categoria: "Faldas",
        estado: "disponible",
        fecha: "2025-03-28"
      },
      {
        id: "P003",
        nombre: "Sudadera Oversize Minimal",
        precio: 490,
        talla: "L",
        categoria: "Sudaderas",
        estado: "vendido",
        fecha: "2025-04-02"
      }
    ];

    function inicializarDatosPublicaciones() {
      if (!localStorage.getItem("misProductos")) {
        localStorage.setItem("misProductos", JSON.stringify(publicacionesBase));
      }
    }

    function actualizarResumenPublicaciones() {
      const productos = JSON.parse(localStorage.getItem("misProductos")) || [];
      document.getElementById("totalProductos").textContent = "Productos publicados: " + productos.length;
    }

    /* ── INIT ───────────────────────────────────── */
    (async function iniciar() {
      // El perfil requiere una cuenta real: sin sesión, se manda a login y
      // de ahí de regreso aquí mismo.
      const usuario = await obtenerUsuarioActual();
      if (!usuario) {
        window.location.href = "login.html?next=" + encodeURIComponent("Interfaz Cliente - Perfil.html");
        return;
      }

      let perfil = null;
      try {
        perfil = await obtenerPerfilCliente(usuario.uid);
      } catch (err) {
        console.error(err);
      }
      pintarPerfil(perfil, usuario);

      escucharVentasDeCliente(usuario.uid, (ventas) => {
        ventasCliente = ventas;
        pintarNumCompras();
      }, (err) => console.error(err));

      inicializarDatosPublicaciones();
      actualizarResumenPublicaciones();
    })();
  </script>

</body>
</html>
