<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promociones - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="dialogos.js"></script>
</head>
<body>

  <div id="header"></div>

  <section class="promo-wrapper">
    <h2 class="promo-title">Promociones</h2>

    <div class="promo-cards">
      <div class="promo-card">
        <div>
          <h3>2 x 1 en Blusas</h3>
          <p>Llévate dos piezas al precio de una</p>
        </div>
        <div class="promo-bottom">
          <span class="promo-code">CUTECANDY50</span>
          <span class="promo-value">50%</span>
        </div>
      </div>

      <div class="promo-card">
        <div>
          <h3>10% en tu tercer prenda</h3>
          <p>Descuento en toda la línea de productos al llevar la tercer prenda</p>
        </div>
        <div class="promo-bottom">
          <span class="promo-code">CUTECANDY10</span>
          <span class="promo-value">10%</span>
        </div>
      </div>

      <div class="promo-card">
        <div>
          <h3>Envío Gratis</h3>
          <p>En compras mayores a $2000</p>
        </div>
        <div class="promo-bottom">
          <span class="promo-code">CUTENVIO1</span>
          <span class="promo-value" style="font-size:16px; letter-spacing:4px;">ENVÍO</span>
        </div>
      </div>
    </div>

    <div class="coupon-box">
      <div class="coupon-percent">%</div>
      <div class="coupon-text">¿Tienes un descuento?</div>
      <div class="coupon-form">
        <input type="text" id="codigoPromo" placeholder="INGRESA TU CODIGO" />
        <button type="button" onclick="aplicarCodigo()">Aplicar</button>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module">
    import { validarCupon } from './firebase-db.js';

    // Los cupones ya no están escritos aquí: viven en la colección "promociones" de Firebase,
    // con fecha de vigencia (se administran en el panel: Promociones).
    async function aplicarCodigo() {
      const codigo = document.getElementById("codigoPromo").value.trim().toUpperCase();

      if (!codigo) {
        await bpAlerta("Ingresa un código.", { tipo: 'aviso' });
        return;
      }

      try {
        const r = await validarCupon(codigo);
        if (!r.ok) {
          await bpAlerta(r.motivo, { tipo: 'error', titulo: 'Cupón no válido' });
          return;
        }
        localStorage.setItem("cuponAplicado", JSON.stringify(r.cupon));
        bpAlerta("Cupón aplicado correctamente.", { tipo: 'exito' });
      } catch (err) {
        bpAlerta("No se pudo validar el cupón. Revisa tu conexión e inténtalo de nuevo.", { tipo: 'error' });
      }
    }
    window.aplicarCodigo = aplicarCodigo;
  </script>
</body>
</html>
