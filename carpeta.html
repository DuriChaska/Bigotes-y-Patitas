<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colección exclusiva - Bigotes y Patitas</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="dialogos.js"></script>
</head>
<body class="cp-body">

  <div id="header"></div>
  <div id="toast-container"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cp-huella" viewBox="0 0 64 64">
      <ellipse cx="32" cy="44" rx="15" ry="13"/>
      <ellipse cx="13" cy="27" rx="7" ry="9" transform="rotate(-20 13 27)"/>
      <ellipse cx="25" cy="15" rx="7" ry="9" transform="rotate(-6 25 15)"/>
      <ellipse cx="40" cy="15" rx="7" ry="9" transform="rotate(6 40 15)"/>
      <ellipse cx="52" cy="27" rx="7" ry="9" transform="rotate(20 52 27)"/>
    </symbol>
    <symbol id="cp-corazon" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.6 4.5 7.1 4.5c2 0 3.4 1.1 4.9 3 1.5-1.9 2.9-3 4.9-3 3.5 0 5.6 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" stroke-width="2" stroke-linejoin="round"/></symbol>
  </svg>

  <!-- Portada -->
  <section class="cp-hero">
    <div class="cp-hero-dentro">
      <nav class="pd-ruta" aria-label="Ruta de navegación">
        <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>Inicio</a>
        <span>/</span><strong>Carpeta</strong>
      </nav>
      <div class="cp-hero-grid">
        <div>
          <p class="franja-ante">Edición limitada</p>
          <h1 class="franja-titulo cp-hero-titulo">Colección exclusiva</h1>
          <span class="franja-linea" aria-hidden="true"></span>
          <p class="cp-hero-texto" id="hero-texto">Piezas especiales, hechas en pocas unidades, para que tu peludito luzca único en cada paseo.</p>
          <a href="#cp-pieza" class="cp-hero-btn">Conócela <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
        <div class="cp-hero-foto">
          <img id="hero-img" src="Imagenes/Productos/vestido-picnic-rojo-1.jpg" alt="" />
          <svg class="cp-deco d1" aria-hidden="true"><use href="#cp-huella"/></svg>
          <svg class="cp-deco d2" aria-hidden="true"><use href="#cp-huella"/></svg>
        </div>
      </div>
    </div>
    <svg class="ola ola-abajo cp-ola" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
      <path class="ola-clara" d="M0 50 C220 80 520 90 800 66 C1080 44 1260 60 1440 72 V0 H0 Z"/>
      <path class="ola-fondo" d="M0 28 C240 56 520 62 800 42 C1080 22 1260 38 1440 50 V0 H0 Z"/>
    </svg>
  </section>

  <main class="cp-pagina">
    <!-- Pieza destacada -->
    <section id="cp-pieza" class="cp-pieza" aria-live="polite">
      <p class="cp-cargando" id="cp-cargando">Cargando la colección…</p>
    </section>

    <!-- Reseñas reales de la pieza -->
    <section class="cp-resenas" id="cp-resenas" hidden>
      <p class="dest-antetitulo">Opiniones reales</p>
      <h2 class="cp-titulo">Lo que dicen nuestras clientas</h2>
      <div class="cp-resenas-grid" id="lista-resenas"></div>
    </section>

    <!-- Más de la colección -->
    <section class="destacados cp-mas" id="cp-mas" hidden>
      <p class="dest-antetitulo">Ediciones limitadas</p>
      <svg class="dest-huella" aria-hidden="true"><use href="#cp-huella"/></svg>
      <h2 class="dest-titulo">Más de la colección</h2>
      <div class="dest-carrusel">
        <div class="dest-pista" id="pista-mas"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="components.js"></script>
  <script type="module" src="carpeta.js"></script>
</body>
</html>
